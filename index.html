 try{const m=mkt(c),f=fairView(c),bs=vscen(c,"base"),b2=vscen(c,"bear2"),b3=vscen(c,"bear3"),cr=metrics(c),news=((LIVE.co||{})[c.t]?.news||[]).map(n=>n.url||n.t).concat((LIVE.news||[]).filter(x=>(x.tk||[]).includes(c.t)).map(x=>x.url));
  return {at:new Date().toISOString(),px:m?.px??null,d:m?.d||"",q:c.q||"",fair:f&&!f.losing?(f.px??null):null,base:bs.losing?null:(bs.px??null),bear2:b2.losing?null:(b2.px??null),bear3:b3.losing?null:(b3.px??null),
   rating:cr.model,agency:c.notch??null,hid:hidden(c).total,debt:c.debt,ebitda:c.ebitda,news}}
 finally{S.cp=cp0;if(sc0)S.sc[c.t]=sc0;else delete S.sc[c.t]}}
function watchToggle(t){if(WL[t])delete WL[t];else{const c=find(t);if(c)WL[t]={snap:snap(c)}}wSave();drawBell()}
const chgPct=(a,b)=>a&&b!=null&&a!==0?(b/a-1)*100:null;
/* compare saved snapshot with today; each change explains itself */
function changes(t){const w=WL[t],c=find(t);if(!w||!c)return [];const o=w.snap,n=snap(c),out=[];
 const add=(sev,title,body,jump)=>out.push({sev,title,body,jump});
 if(n.q&&o.q&&n.q!==o.q)add("high",`New results: ${n.q}`,`${esc(c.name)} reported new numbers since you started watching (it was ${esc(o.q)}). Revenue, debt and cash were refreshed, so everything below may have moved.`,"fa");
 if(n.rating!==o.rating){const up=n.rating<o.rating,lev0=o.ebitda>0?(o.debt+o.hid)/o.ebitda:null,lev1=n.ebitda>0?(n.debt+n.hid)/n.ebitda:null;
  add("high",`Off Book rating ${up?"up":"down"}: ${NOTCH[o.rating]} → ${NOTCH[n.rating]}`,`${lev0!=null&&lev1!=null&&Math.abs(lev1-lev0)>=0.1?`Debt including hidden obligations went from ${fx(lev0)}× to ${fx(lev1)}× a year's cash profit. `:""}${(o.rating<=9)!==(n.rating<=9)?`That crosses the line between investment grade and junk, which changes who can own the bonds and what the company pays to borrow.`:`Lower grades mean higher borrowing costs and less room for error.`}`,"cr")}
 if(n.agency!==o.agency&&n.agency!=null&&o.agency!=null)add("high",`Agency rating changed: ${NOTCH[o.agency]} → ${NOTCH[n.agency]}`,`S&P, Moody's or Fitch moved their view. Compare it with the Off Book rating on the stock page.`,"cr");
 const dp=chgPct(o.px,n.px);if(dp!=null&&Math.abs(dp)>=WTH.px){const g0=o.fair?chgPct(o.px,o.fair):null,g1=n.fair?chgPct(n.px,n.fair):null;
  add(Math.abs(dp)>=10?"high":"med",`Price ${dp>0?"up":"down"} ${fx(Math.abs(dp),0)}%: ${fp(o.px)} → ${fp(n.px)}`,`${g0!=null&&g1!=null?`Against fair value it went from ${fpc(g0)} to ${fpc(g1)}. `:""}${g1!=null?(g1>10?"It now trades below what fundamentals support.":g1<-10?"It now trades above what fundamentals support.":"It now trades close to fair value."):""}`,"vd")}
 const df=chgPct(o.fair,n.fair);if(df!=null&&Math.abs(df)>=WTH.fair)add("med",`Fair value ${df>0?"up":"down"} ${fx(Math.abs(df),0)}%: ${fp(o.fair)} → ${fp(n.fair)}`,`Earnings expectations, debt or contracts changed. The scenarios and sensitivity table use the new figure.`,"vd");
 else if(o.fair!=null&&n.fair==null)add("high","Fair value can no longer be worked out",`Earnings or cash profit turned negative, so a multiple can't price it.`,"vd");
 [["bear2","Bear 2 (a big customer falls short)"],["bear3","Bear 3 (AI winter)"]].forEach(([k,l])=>{const d=chgPct(o[k],n[k]);if(d!=null&&Math.abs(d)>=WTH.bear)add("med",`Stress result moved: ${l} ${fp(o[k])} → ${fp(n[k])}`,`The downside case is now ${fx(Math.abs(d),0)}% ${d>0?"less":"more"} severe. ${d<0?"Something raised the stakes: new commitments, more debt, or a customer that matters more.":"Exposure came down or earnings grew."}`,"st");
  else if(o[k]!=null&&n[k]==null)add("high",`In ${l} the business now loses money`,`The downside case got much worse: cash profit turns negative.`,"st")});
 const dh=chgPct(o.hid,n.hid);if(dh!=null&&Math.abs(dh)>=10&&Math.abs(n.hid-o.hid)>1)add("med",`Hidden obligations ${dh>0?"up":"down"}: ${fb(o.hid)} → ${fb(n.hid)}`,`Leases, joint-venture debt or guarantees changed. These don't show up as debt but have to be paid.`,"obs");
 const fresh=((LIVE.co||{})[t]?.news||[]).filter(x=>!(o.news||[]).includes(x.url||x.t));
 fresh.forEach(x=>add("low",`News: ${x.t}`,`${x.d?x.d+". ":""}<a href="${esc(x.url||"#")}" target="_blank" rel="noopener">Read the source</a>`,"ov"));
 const top=(LIVE.news||[]).filter(x=>(x.tk||[]).includes(t)&&!(o.news||[]).includes(x.url));
 top.forEach(x=>add("low",`In today's top stories: ${x.title}`,`${esc(x.why||"")} <a href="${esc(x.url)}" target="_blank" rel="noopener">Read it</a>`,"ov"));
 const rank={high:0,med:1,low:2};return out.sort((a,b)=>rank[a.sev]-rank[b.sev])}

const PURPOSE=`<div class="purpose"><p><b>Why it's worth your time:</b> fund analysts spend days pulling this out of filings before they buy. Here it's one page per stock: what the company really owes, whether today's price makes sense, and how far it could fall if the AI money slows.</p><p class="note">Not a stock recommendation or investment advice. <a href="#method">How it works</a></p></div>`;
const WHYOFF=`<details class="panel"><summary class="pbody" style="display:block"><b>Why are things off the balance sheet? (It isn't hiding anything.)</b></summary><div class="pbody" style="padding-top:0"><p class="prose">Accounting rules say what goes on the balance sheet and when. A lease is recorded when the building is handed over, not when it's signed. Revenue is booked as work is delivered, not when a contract is signed. A guarantee is a promise, not a debt, until someone fails to pay. A joint venture the company doesn't control keeps its own books. Companies disclose all of these in the footnotes of their 10-K and 10-Q filings. Off Book reads those footnotes and adds the items up, so you can see them next to the reported numbers. Showing them is not an accusation that any company is misreporting.</p></div></details>`;

function ladder(c,m){
 const W0=374,cw=W0/17,y=36;const bc=n=>band(n)==="ig"?"var(--up)":band(n)==="xo"?"var(--warn)":"var(--down)";
 let g="";for(let i=0;i<17;i++){g+=`<rect x="${i*cw+1}" y="${y}" width="${cw-2}" height="9" rx="2" fill="${bc(i)}" opacity="${i===m.model?1:0.25}"/>`;
  if(i%2===0||i===9)g+=`<text x="${(i+0.5)*cw}" y="${y-18}" font-size="9" text-anchor="middle" fill="var(--muted)">${NOTCH[i]}</text>`}
 g+=`<line x1="${10*cw}" x2="${10*cw}" y1="${y-8}" y2="${y+46}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${10*cw+4}" y="${y+56}" font-size="9" fill="var(--muted)">junk / high yield →</text>`;
 const x=n=>(n+0.5)*cw;
 if(c.notch!=null)g+=`<path d="M${x(c.notch)-6} ${y-13} L${x(c.notch)+6} ${y-13} L${x(c.notch)} ${y-3}Z" fill="var(--text)"/>`;
 g+=`<circle cx="${x(m.model)}" cy="${y+18}" r="6" fill="var(--accent)"/>`;
 const cn=cdsNotch(c.cds);if(cn!=null)g+=`<path d="M${x(cn)} ${y+27} l7 7 l-7 7 l-7 -7Z" fill="var(--violet)"/>`;
 return `<div class="tbl"><svg class="ladder" viewBox="0 0 ${W0} 100" width="100%" style="min-width:320px;display:block" role="img" aria-label="Rating ladder from AAA to CCC">${g}</svg></div>
 <div class="legend"><span><i style="background:var(--text)"></i>Agency rating: ${esc(c.rating)}</span><span><i style="background:var(--accent);border-radius:50%"></i>Off Book rating: ${NOTCH[m.model]}</span><span><i style="background:var(--violet);transform:rotate(45deg)"></i>Bond market: ${cn!=null?NOTCH[cn]:"not actively traded"}</span></div>`;
}

/* ===== AI money circle ===== */
function circleData(){const E=DEALS.map((d,i)=>({a:d.a,b:d.b,i,d}));const nodes=[...new Set(E.flatMap(e=>[e.a,e.b]))];
 const out={};E.forEach(e=>{(out[e.a]=out[e.a]||[]).push(e)});const loops=[],seen=new Set();
 const dfs=(start,cur,path,depth)=>{(out[cur]||[]).forEach(e=>{if(e.b===start&&path.length>=1){const ns=[start,...path.map(p=>p.b)];const key=[...ns].sort().join(">")+"|"+[...path.map(p=>p.i),e.i].sort().join(",");if(!seen.has(key)){seen.add(key);loops.push([...path,e])}}
  else if(depth<4&&!path.some(p=>p.a===e.b)&&e.b!==start&&!path.some(p=>p.b===e.b))dfs(start,e.b,[...path,e],depth+1)})};
 nodes.forEach(n=>dfs(n,n,[],1));
 const uniq=[],sig=new Set();loops.forEach(L=>{const s=[...new Set(L.map(e=>e.a))].sort().join("-");if(!sig.has(s)){sig.add(s);uniq.push(L)}});
 uniq.forEach(L=>L.val=L.reduce((a,e)=>a+(e.d.val||0),0));uniq.sort((x,y)=>y.length-x.length||y.val-x.val);
 return {E,nodes,loops:uniq,total:uniq.length}}
function moneyCircle(c){const all0=circleData(),E=all0.E,loops=all0.loops.filter(L=>L.some(e=>e.a===c.t||e.b===c.t)).slice(0,8);
 if(!loops.length)return "";
 const key="loop-"+c.t,sel=Math.min(S[key]??0,loops.length-1),L=loops[sel];
 const nodes=[...new Set(loops.flatMap(L=>L.flatMap(e=>[e.a,e.b])))].sort((a,b)=>(a===c.t?-1:b===c.t?1:0));
 const R=Math.max(150,nodes.length*20),cx=R+70,cy=R+40,P={};nodes.forEach((n,i)=>{const t=-Math.PI/2+i*2*Math.PI/nodes.length;P[n]=[cx+R*Math.cos(t),cy+R*Math.sin(t)]});
 const inL=e=>L.some(x=>x.i===e.i),onN=n=>L.some(x=>x.a===n||x.b===n);
 const col={equity:"var(--accent)",buy:"var(--muted)",back:"var(--violet)"};
 const used=E.filter(e=>loops.some(L=>L.some(x=>x.i===e.i)));
 const edges=used.map(e=>{const [x1,y1]=P[e.a],[x2,y2]=P[e.b],h=inL(e),dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  return `<line x1="${x1+ux*36}" y1="${y1+uy*14}" x2="${x2-ux*40}" y2="${y2-uy*18}" stroke="${col[e.d.kind]}" stroke-width="${h?3.2:1.2}" opacity="${h?1:0.18}" marker-end="url(#ar${h?"h":""}-${c.t})"/>`}).join("");
 const lab=n=>NODES[n]?NODES[n].split(" ")[0]:n;
 const ns=nodes.map(n=>{const [x,y]=P[n],h=onN(n),me=n===c.t;return `<g opacity="${h?1:0.35}"><rect x="${x-40}" y="${y-13}" width="80" height="26" rx="6" fill="${me?"color-mix(in srgb,var(--accent) 18%,var(--panel))":"var(--panel)"}" stroke="${h?"var(--accent)":"var(--line)"}" stroke-width="${h||me?2:1}"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="var(--text)">${esc(lab(n).slice(0,10))}</text></g>`}).join("");
 const steps=L.map(e=>`<li><b>${esc(nm(e.a))} → ${esc(nm(e.b))}</b>: ${esc(e.d.out)}${e.d.val?` (${fb(e.d.val)})`:""} <span class="muted">${esc(e.d.dt||"")}</span></li>`).join("");
 const name=x=>x.map(e=>esc(lab(e.a))).join(" → ")+" → "+esc(lab(x[0].a));
 return `<div class="panel circle" id="circle"><div class="ptitle"><h2>${esc(c.name)}'s money loops</h2><span class="r">${loops.length} loop${loops.length===1?"":"s"} that run through ${esc(c.t)}</span></div><div class="pbody">
 <p class="prose">A loop is when money goes around in a circle: for example a supplier invests in a customer, the customer signs a big contract, and that contract pays the supplier back. These are the loops ${esc(c.name)} is part of, built from the dated deals above. Pick one to trace it.</p>
 <div class="loops">${loops.map((x,k)=>`<button type="button" class="${k===sel?"on":""}" data-loop="${k}">${name(x)}</button>`).join("")}</div>
 <svg viewBox="0 0 ${2*cx} ${2*cy}" role="img" aria-label="Money loops involving ${esc(c.name)}"><defs><marker id="ar-${c.t}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--muted)"/></marker><marker id="arh-${c.t}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)"/></marker></defs>${edges}${ns}</svg>
 <div class="legend" style="justify-content:center"><span><i style="background:var(--accent)"></i>Invests in / owns a stake</span><span><i style="background:var(--muted)"></i>Pays for chips or cloud</span><span><i style="background:var(--violet)"></i>Guarantees or backstops</span></div>
 <div class="sub">How this loop works</div><ol class="why">${steps}</ol><p class="note">Why it matters for credit: if one company in the loop can't pay, ${esc(c.name)} can lose a customer and an investment at the same time.</p></div></div>`}

function home(){
 const rows=COS.map(c=>{const m=mkt(c),b=metrics(c),owed=(CM[c.t]||[]).filter(l=>l.dir==="in"&&l.kind==="contract").reduce((a,l)=>a+l.total,0),h=hidden(c);
  return `<tr data-open="${c.t}" tabindex="0"><td class="tk">${c.t}</td><td class="nm">${esc(c.name)}</td><td>${fp(m?.px)}</td><td class="${cls(m?.chg)}">${m?.chg!=null?fpc(m.chg):"—"}</td><td>${tag(c.notch,c.notch==null?"Not rated":NOTCH[c.notch])}</td><td>${tag(b.model)}</td><td>${fb(c.debt)}</td><td>${fb(h.total)}</td><td>${owed?fb(owed):"—"}</td></tr>`}).join("");
 const cards=COS.map(c=>{const m=mkt(c),b=metrics(c),h=hidden(c);return `<div class="mcard" data-open="${c.t}" tabindex="0" role="button"><span><span class="tk">${c.t}</span> <span class="nm">${esc(c.name)}</span></span><span class="num">${fp(m?.px)} <span class="${cls(m?.chg)}">${m?.chg!=null?fpc(m.chg):""}</span></span>
  <span class="r">${tag(b.model,"Off Book "+NOTCH[b.model])} <span class="muted">Agency ${c.notch==null?"NR":NOTCH[c.notch]}</span> · <span>Hidden ${fb(h.total)}</span></span></div>`}).join("");
 const ex=all().filter(c=>!COS.some(x=>x.t===c.t)).sort((a,b)=>(b.researched?1:0)-(a.researched?1:0));

 const cards=r.per.length?`<div class="sub">Contracts in this case</div><div class="two">${r.per.map(p=>`<div class="ccard"><div class="hd">${esc(p.l.label)} <small>· ${esc(p.q.n)} · ${p.l.yrs} yrs</small></div>
  <div><span class="l">Contract value</span><span class="v">${fb(p.l.total)}</span></div><div><span class="l">Paid in this case</span><span class="v ${p.pp<100?"down":""}">${fb(p.paid)} (${fx(p.pp,0)}%)</span></div>
  <div><span class="l">Cost to deliver, after cutting what it can</span><span class="v">${fb(p.costKept)}</span></div><div><span class="l">Profit: full vs this case</span><span class="v ${p.profit<p.full-0.05?"down":""}">${fb(p.full)} → ${fb(p.profit)}</span></div><div><span class="l">Cost it can cut if unpaid</span><span class="v">${fx(100-(p.l.drop??.8)*100,0)}%</span></div></div>`).join("")}</div>
  <p class="note">Buildings, chips and leases are paid for up front, so when a customer pays less the company can cut only part of the cost of the unpaid work (10 to 50%, set per contract).</p>`:"";
 const e1b=hasV?(b.meth==="pe"?b.base*(1+vs.g/100):b.base*(1+vs.g/100)):null;
 const tbl=`<div class="sub">Today vs ${esc(S0.tag.toLowerCase())}</div><div class="tbl"><table><thead><tr><th>$ in billions</th><th>Today</th><th>This case</th><th>Change</th></tr></thead><tbody>
 <tr class="grp"><td colspan="4">Last 12 months, restated for this case</td></tr>${dRow("Revenue",c.rev,r.rev2,fb,true)}${dRow("EBITDA (cash operating profit)",c.ebitda,r.e2,fb,true)}${r.ni!=null?dRow("Net income",r.ni,r.ni2,fb,true):""}${dRow("Interest cost",c.interest,r.int2,fb,false)}
 <tr class="grp"><td colspan="4">Balance sheet</td></tr>${dRow("Reported debt",c.debt,r.debt2,fb,false,r.guarDebt>0.05?"Includes guarantees that get called":"")}${dRow("Hidden obligations (70% of leases, JV debt, guarantees)",r.hid.total,r.hid2,fb,false)}
 <tr class="grp"><td colspan="4">Cash flow (per year)</td></tr>${dRow("Cash from operations",c.ocf,r.ocf2,fb,true)}${dRow("Free cash flow",r.fcf,r.fcf2,fb,true)}
 <tr class="grp"><td colspan="4">Credit</td></tr><tr><td class="l">Off Book rating</td><td>${tag(r.cr0.model)}</td><td>${tag(r.cr.model)}</td><td class="${r.cr.model>r.cr0.model?"down":""}">${r.cr.model>r.cr0.model?"down "+(r.cr.model-r.cr0.model)+" notch"+(r.cr.model-r.cr0.model>1?"es":""):r.cr.model<r.cr0.model?"up "+(r.cr0.model-r.cr.model):"—"}</td></tr>
 ${dRow("Debt incl. hidden ÷ EBITDA",r.cr0.v.adj,r.e2>0?r.cr.v.adj:null,v=>v==null?"n/m":fx(v)+"x",false)}${dRow("Interest coverage (EBITDA ÷ interest)",Math.min(r.cr0.v.cov,999),Math.max(Math.min(r.cr.v.cov,999),0),v=>fx(v)+"x",true)}${dRow("Chance of default within a year",r.cr0.pd,r.cr.pd,v=>fx(v,2)+"%",false)}
 ${r.cr.cov?`<tr><td class="l">Loan covenant (minimum ${r.cr.cov.min}x)</td><td>${fx(r.cr0.cov.val)}x</td><td class="${r.cr.cov.val<r.cr.cov.min?"down":""}">${fx(r.cr.cov.val)}x${r.cr.cov.val<r.cr.cov.min?" · breached":""}</td><td></td></tr>`:""}
 ${hasV?`<tr class="grp"><td colspan="4">Valuation, next 12 months (Today = base case)</td></tr>${dRow(b.meth==="pe"?"Earnings per share":"EBITDA",e1b,o.losing&&!(o.earn>0)?null:o.earn,b.meth==="pe"?fp:fb,true)}${dRow(`Multiple (${munit(b)})`,vs.mult,o.mult,fm,true)}${o.sh2>b.sh+1e-6?dRow("Shares (billions)",b.sh,o.sh2,v=>fx(v,2),false):""}${o.losing?"":dRow("Implied price vs base case",vscen(c,"base").px,o.wiped?0:o.px,fp,true)+dRow("Implied price vs today's price",m.px,o.wiped?0:o.px,fp,true)}`:""}

function methodPage(){const cpRows=Object.entries(CP).map(([k,q])=>`<tr><td class="l">${esc(q.n)}</td><td>${q.p}%</td><td>${q.rec}%</td><td>${fx((100-q.p)+q.p*q.rec/100,0)}%</td></tr>`).join("");
 return `<div class="panel method"><div class="ptitle"><h2>How Off Book works</h2><span class="r">Methodology and limits</span></div><div class="pbody">
 <h3>1. What we add up</h3><p>Reported debt comes from the latest 10-Q or 10-K. <b>Hidden obligations</b> use one formula everywhere on the site: <b>70% of lease commitments + 100% of joint-venture debt + 100% of guarantees</b>. Leases count at 70% because future rent is worth less today than its face value. Purchase commitments are shown but not counted as debt: they're cash already promised, not borrowing. Where a company has no itemized commitments mapped yet, Off Book uses 50% of its estimated off-balance-sheet total and marks it estimated.</p>
 <h3>2. The Off Book rating</h3><p>Eight factors, each graded AAA to CCC, then weighted: ${FACTORS.map(([k,n])=>`${n} ${Math.round(W[k]*100)}%`).join(", ")}. Business risk is an analyst judgment; the rest are calculated. Hard limits apply on top: a loan-covenant breach caps the grade at B+, negative EBITDA means CCC, and debt including hidden obligations above 8x, 12x or 20x EBITDA caps it at BB, B or CCC. The chance of default for each grade comes from long-run averages for rated companies.</p>
 <h3>3. Fair value: what fundamentals support</h3><p>Off Book values each company on what it is expected to earn over the next 12 months and what investors typically pay for that kind of business, so the fair value can sit above or below today's price.</p>
 <ul><li><b>Earnings method</b> (most companies): next-12-month earnings per share × a fair forward P/E. Next-12-month EPS is trailing EPS (price ÷ trailing P/E) grown at the expected rate. Where we found a consensus or guided figure (NVIDIA, Microsoft, Oracle, Palantir) the default growth is the rate that reaches it, and the source is listed on the company page. Where reported profit includes one-off investment gains (Alphabet, Amazon), we start from an operating figure instead.</li>
 <li><b>Cash-profit method</b> (Intel, CoreWeave, Nebius, and any company with negative earnings): next-12-month EBITDA × a fair company value ÷ EBITDA multiple, minus net debt, per share. Companies on the earnings method also show this as a cross-check, with and without hidden obligations counted as debt.</li>
 <li>If cash profit is negative there is nothing to value and no price is shown. If debt is larger than the business is worth, the price shows as $0.</li></ul>
 <p><b>What the market is pricing in:</b> today's price ÷ next-12-month earnings gives the multiple the market pays. Holding the fair multiple, we also solve for the growth today's price requires. The gauge compares fair value with the price: within 10% is "about fair", 10–30% is under- or overvalued, beyond 30% "deeply". The fair multiple and growth are Off Book estimates from how each sector has traded (table below); change them with the sliders.</p>
 <div class="tbl"><table><thead><tr><th>Company</th><th>Method</th><th>Fair multiple</th><th>Growth, next 12 months</th><th>Why</th></tr></thead><tbody>${Object.entries(VAL).map(([t,v])=>{const c=find(t),b=c?vbase(c):null;return `<tr><td class="l">${esc(t)}</td><td>${v.m==="ev"?"EV/EBITDA":"P/E"}</td><td>${fm(v.m==="ev"?v.ev:v.pe)}</td><td>${b&&b.meth?fg(b.g0):v.g!=null?fg(v.g):"—"}${v.eps1?" (from published estimates)":""}</td><td class="l"><small>${esc(v.why)}</small></td></tr>`}).join("")}</tbody></table></div>
 <p>Companies without their own row use sector defaults: ${VSEC.map(([re,v,lab])=>`${lab} ${fm(v.m==="ev"?v.ev:v.pe)} ${v.m==="ev"?"EV/EBITDA":"P/E"} with ${v.g}% growth`).join("; ")}.</p>
 <h3>4. The scenarios</h3><p>Each scenario sets three things: what customers pay, how fast earnings grow, and what investors pay for them.</p><ul>${SCEN.map(s=>`<li><b>${s.tag}: ${s.name}</b>. ${s.needs.join("; ")}.</li>`).join("")}</ul>
 <p>Growth changes are in percentage points: for example, with 40% expected growth the Bull case uses 40 + 5 + 0.25 × 40 = 55%, and Bear 2 uses 40 − 5 − 0.3 × 40 = 23%. For companies with little direct AI exposure the bear cases use 40% of the growth, multiple and sales hit. Bear 2 treats any customer at a ${RISKY}% or higher chance of falling short as the one that does; Bear 3 does it for every AI lab and neocloud, and halfway for big tech customers.</p>
 <p><b>Implied price</b> = next-12-month earnings before any customer shortfall × the scenario's multiple, minus the value of profit lost on contracts over their remaining life (discounted at 9%, taxed at 17%), minus guarantees that get called, divided by shares (plus warrant shares if you switch them on). Lost profit is valued over the contract's life rather than multiplied by the P/E, because a contract that ends in five years shouldn't cost the company forever. Scenario EPS shown on the cards is after the shortfall and the extra interest on borrowed cash.</p>
 <p><b>Credit rating per scenario</b> uses the last 12 months restated for the case: lost contract profit, the rest of the business moving ${SCEN.map(s=>`${s.rest>0?"+":""}${s.rest}%`).join(" / ")} (Bull to Bear 3), guarantees called and lost cash borrowed at 6%. Base is today's reported figures, so its rating is always the headline Off Book rating. Contracts signed recently whose revenue has barely started (OpenAI's Oracle, Azure and AWS deals, for example) count at half against the last 12 months; the Bull case adds the other half. A bear case never shows a better rating than Base.</p>
 <p><b>Sensitivity table</b>: rows are the multiple (55% to 150% of the fair multiple, plus the market's own multiple); columns are next-12-month growth (the expected rate ± two steps of a quarter of it, at least 5 points), or, if you switch, the share of the main customer's contracts actually paid, with every other customer paying in full. The main customer is the one with the largest expected loss on the default assumptions. Today's price is the cell at the market's multiple and expected growth.</p>
 <h3>5. Customer assumptions</h3><div class="tbl"><table><thead><tr><th>Customer group</th><th>Chance it falls short</th><th>Share still paid if it does</th><th>Expected share paid</th></tr></thead><tbody>${cpRows}</tbody></table></div><p>When a customer pays less, most of the lost revenue becomes lost cash profit, because buildings, chips and leases are already committed. How much is set per contract (usually 50 to 90%; 100% for pure license income like Apple's search payments) and shown on each contract card. You can change every assumption on any company page; changes apply to every company that sells to that customer.</p>
 <h3>6. Data and updates</h3><p>Financials come from company filings and earnings releases; each company page lists its own sources, and estimates are marked EST. News and closing prices refresh every evening, and ${PER_DAY} new companies are researched each day from the research list.</p>
 <h3>7. Limits</h3><ul><li>One year of earnings says little about very fast growers (Nebius, CoreWeave, Palantir, Tesla): their prices reflect many years of expected growth, so a fair value on next-year earnings will look low. Move the multiple to see what you would have to believe.</li><li>Fair multiples are judgment, informed by how peers have traded, not a live peer screen.</li><li>A scorecard can't capture everything agencies weigh: management, legal risk, how lasting a business is.</li><li>Some inputs are estimates where companies don't disclose them (for example how much backlog depends on one customer).</li><li>The chances of a shortfall are judgment calls, not market prices. Change them and see.</li><li>Not investment advice.</li></ul>
 <p><a href="#home">Back to all stocks</a></p></div></div>`}
function about(){return `${PURPOSE}<div class="panel"><div class="ptitle"><h2>Why I built Off Book</h2></div><div class="pbody">
 <p class="prose">I'm interested in where AI and finance meet. Reading about the AI buildout, I kept hitting the same problem: the debt on a balance sheet only tells part of the story. The bigger risks sit in newer structures most people don't track: suppliers investing in their own customers, leases on data centers that aren't built yet, guarantees, off-balance-sheet joint ventures, and contracts worth hundreds of billions from customers that are still losing money.</p>
 <p class="prose">Finding this today means reading 10-Ks, 10-Qs and a pile of news, then doing the math yourself. Off Book does that for any stock. It adds up the commitments on and off the books and lets you stress them: if a $300B contract has a 35% chance of being only half paid, you see what that does to earnings, debt, cash flow, the rating, the valuation multiples and the share price.</p>
 <p class="prose">News, prices and searched stocks refresh every day.</p>
 <p><a href="#home">Back to all stocks</a></p></div></div>`}

const hq=document.getElementById("hq");const hs=document.createElement("div");hs.style.cssText="position:fixed;left:0;right:0;z-index:6;max-width:960px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 0";document.body.appendChild(hs);
function placeSugg(){hs.style.top=document.querySelector("header.top").getBoundingClientRect().bottom+"px"}
const setSugg=x=>{hs.innerHTML=x;hs.hidden=!x};setSugg("");
hq.addEventListener("input",()=>{placeSugg();setSugg(suggestHTML(hq.value))});
hq.addEventListener("blur",()=>setTimeout(()=>setSugg(""),200));
document.getElementById("hform").addEventListener("submit",e=>{e.preventDefault();const v=hq.value;hq.value="";setSugg("");hq.blur();go(v)});
hs.addEventListener("mousedown",e=>e.preventDefault());
hs.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o){hq.value="";setSugg("");location.hash="co-"+o.dataset.open.toLowerCase();return}const a=e.target.closest("[data-ask]");if(a){hq.value="";setSugg("");ask(a.dataset.ask);return}const qb=e.target.closest("[data-q]");if(qb){hq.value="";setSugg("");location.hash="q-"+encodeURIComponent(qb.dataset.q.toLowerCase())}});
document.getElementById("tabs").addEventListener("click",e=>{const j=e.target.closest("[data-jump]");if(j){e.preventDefault();const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}});
const app=document.getElementById("app");
app.addEventListener("click",e=>{
 const o=e.target.closest("[data-open]");if(o){location.hash="co-"+o.dataset.open.toLowerCase();return}
 const a=e.target.closest("[data-ask]");if(a){ask(a.dataset.ask);return}
 const rf=e.target.closest("[data-refresh]");if(rf){const t=rf.dataset.refresh;delete S.ai[t];saveAI();ask(t);return}
 if(e.target.closest("[data-reset]")){S.cp={};S.sc[cur().t]=DEF();const y=window.scrollY;render(true);window.scrollTo(0,y);return}
 const sv=e.target.closest("[data-sens]");if(sv){sc(cur()).sens=sv.dataset.sens;const el=document.getElementById("sens");if(el)el.innerHTML=sensBlock(cur());return}
 const da=e.target.closest("[data-dealall]");if(da){S.dealAll=S.dealAll===da.dataset.dealall?null:da.dataset.dealall;S.dealSel=null;const y=window.scrollY;render(true);window.scrollTo(0,y);return}
 const d=e.target.closest("[data-deal]");if(d){const i=+d.dataset.deal;S.dealSel=S.dealSel===i?null:i;const y=window.scrollY;render(true);window.scrollTo(0,y);return}
 const lp=e.target.closest("[data-loop]");if(lp){const cc=cur();if(cc)S["loop-"+cc.t]=+lp.dataset.loop;const y=window.scrollY;render(true);window.scrollTo(0,y);return}
 const sn=e.target.closest("[data-scen]");if(sn){sc(cur()).sel=sn.dataset.scen;updStress();return}
 const jp=e.target.closest("[data-jump]");if(jp){const el=document.getElementById(jp.dataset.jump);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
});
app.addEventListener("input",e=>{const c=cur();if(!c)return;const st=sc(c),t=e.target,v=+t.value,ds=t.dataset||{};
 if(ds.v){st[ds.v]=v;document.querySelectorAll(`[data-out="${ds.v}"]`).forEach(o=>o.textContent=ds.v==="g"?fg(v):fm(v))}
 else if(ds.cp){const k=ds.cp,f=ds.f;S.cp[k]={...(S.cp[k]||{}),[f]:v};
  document.querySelectorAll(`input[data-cp="${k}"][data-f="${f}"]`).forEach(i=>{if(i!==t)i.value=v});document.querySelectorAll(`[data-out="${k}-${f}"]`).forEach(o=>o.textContent=v+"%")}
 else return;updStress()});
app.addEventListener("change",e=>{const c=cur();if(!c)return;const st=sc(c);if(e.target.id==="t-warr"){st.warr=e.target.checked;updStress()}});
app.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("adv"))S.advOpen=e.target.open},true);
app.addEventListener("keydown",e=>{const d=e.target.closest&&e.target.closest("[data-deal],tr[data-open],.mcard[data-open]");if(d&&(e.key==="Enter"||e.key===" ")){e.preventDefault();d.click()}});
/* load today's live data */
function applyLive(j){if(!j||typeof j!=="object")return;LIVE={...LIVE0,...j,co:{...LIVE0.co,...(j.co||{})}};Object.values(LIVE.extra||{}).forEach(c=>{c.researched=true;delete c.ai});}
render();
fetch("live.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j){applyLive(j);const y=window.scrollY;render(true);window.scrollTo(0,y)}}).catch(()=>{});

</script>

</body>
</html>
